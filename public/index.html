<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SALA 33 - Noir Retro</title>
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0d0d0d; color: #cccccc; font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        
        /* Menu de Entrada Estilo Caixa de Diálogo */
        #menu { 
            background: #161616; padding: 30px; 
            border: 4px solid #ffffff; 
            box-shadow: 8px 8px 0px #333333;
            text-align: center; width: 360px;
        }
        #menu h2 { color: #ffffff; margin-top: 0; font-size: 24px; letter-spacing: 4px; }
        #menu p { font-size: 11px; color: #777777; margin-bottom: 20px; }
        
        input[type="text"] { 
            width: 100%; padding: 10px; background: #222222; color: #ffffff; 
            border: 2px solid #555555; font-family: 'Courier New', monospace;
            text-align: center; font-size: 14px; outline: none; margin-bottom: 15px;
        }
        input[type="text"]:focus { border-color: #ffffff; }

        /* Container do Seletor Listado + Preview Window */
        .selector-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222222;
            border: 2px solid #555555;
            padding: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .selector-fields { width: 70%; }
        .selector-fields label { font-size: 10px; color: #888888; display: block; margin-bottom: 5px; }
        
        select {
            width: 100%; padding: 6px; background: #161616; color: #ffffff;
            border: 1px solid #555555; font-family: 'Courier New', monospace;
            font-size: 12px; outline: none; cursor: pointer;
        }
        select:focus { border-color: #ffffff; }

        /* Janela de Visualização da Skin */
        .preview-window {
            width: 64px; height: 64px; background: #111111;
            border: 2px dashed #555555; display: flex; align-items: center;
            justify-content: center; position: relative;
        }
        #spritePreview {
            width: 32px; height: 32px;
            image-rendering: pixelated;
            display: none;
        }
        .preview-fallback {
            font-size: 9px; color: #444444; text-align: center; font-weight: bold;
        }
        
        button { 
            width: 100%; padding: 12px; background: #ffffff; color: #0d0d0d; 
            border: none; font-family: 'Courier New', monospace; font-weight: bold; 
            font-size: 14px; cursor: pointer; box-shadow: 4px 4px 0px #555555;
        }
        button:hover { background: #cccccc; }

        /* Interface do Jogo */
        #gameUI { display: none; flex-direction: column; align-items: center; }
        canvas { background: #1a1a1a; image-rendering: pixelated; border: 4px solid #ffffff; width: 800px; height: 600px; }
        
        #chatContainer { width: 800px; margin-top: 10px; }
        #chatBox { 
            height: 110px; background: #161616; border: 2px solid #444444; 
            padding: 10px; overflow-y: auto; text-align: left; margin-bottom: 5px; 
            font-size: 13px; line-height: 1.6; color: #bbbbbb;
        }
        


        #chatInput { width: 100%; padding: 10px; background: #161616; color: #ffffff; border: 2px solid #444444; font-family: 'Courier New', monospace; outline: none; }
        #chatInput:focus { border-color: #ffffff; }
        .sistema { color: #666666; font-style: italic; }

        /* Relógio BRT */
        #relogioChat {
            text-align: right; font-size: 9px; color: #444;
            margin-bottom: 3px; font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        /* Barra de emojis */
        #emojiBarContainer { position: relative; display: flex; align-items: stretch; gap: 0; margin-top: 5px; }
        #emojiToggle {
            width: 38px; height: 38px; padding: 0; flex-shrink: 0;
            background: #161616; color: #ffffff;
            border: 2px solid #444444; border-right: none;
            font-size: 18px; box-shadow: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #emojiToggle:hover { border-color: #fff; }
        #emojiBarContainer #chatInput { flex: 1; min-width: 0; width: auto; border-left: none; margin-bottom: 0; }
        #emojiPanel {
            display: none; position: absolute; bottom: 110%; left: 0;
            background: #111; border: 2px solid #333;
            padding: 8px; z-index: 100;
            display: none;
        }
        #emojiPanel.aberto { display: grid !important; grid-template-columns: repeat(6, 28px); gap: 3px; }
        .emoji-btn {
            width: 28px; height: 28px; background: #161616;
            border: 1px solid #222; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0; box-shadow: none; font-size: 16px;
        }
        .emoji-btn:hover { border-color: #fff; background: #2a2a2a; }
        /* Twemoji — grayscale universal */
        img.emoji {
            filter: grayscale(100%) brightness(0.8) !important;
            image-rendering: pixelated;
        }
        .emoji-btn img.emoji { width: 18px !important; height: 18px !important; }
        #chatBox img.emoji { height: 1.1em !important; width: 1.1em !important; vertical-align: -0.15em !important; }
        #emojiToggle img.emoji { width: 20px !important; height: 20px !important; }
        .msg-hora { color: #3a3a3a; font-size: 9px; margin-right: 5px; user-select: none; }

        /* =============================================
           MOBILE / RESPONSIVO
        ============================================= */
        #gameCanvasWrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            line-height: 0;
        }

        /* Controles touch sobrepostos ao canvas */
        #mobileControls {
            display: none;
            position: absolute;
            bottom: 6px; left: 0; right: 0;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
            pointer-events: none;
            z-index: 10;
        }
        #mobileControls.ativo { display: flex; }

        /* D-pad */
        #dpad {
            display: grid;
            grid-template-areas: ". up ." "left . right" ". down .";
            grid-template-columns: 44px 44px 44px;
            grid-template-rows: 44px 44px 44px;
            gap: 3px;
            pointer-events: all;
        }
        .dpad-btn {
            width: 44px; height: 44px;
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            padding: 0; box-shadow: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .dpad-btn:active { background: rgba(255,255,255,0.25); border-color: #fff; }
        #btn-up    { grid-area: up; }
        #btn-left  { grid-area: left; }
        #btn-right { grid-area: right; }
        #btn-down  { grid-area: down; }

        /* Botões de ação */
        #actionBtns {
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: all;
        }
        .action-btn {
            width: 52px; height: 52px;
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 13px; font-weight: bold;
            font-family: 'Courier New', monospace;
            display: flex; align-items: center; justify-content: center;
            padding: 0; box-shadow: none; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none; letter-spacing: 1px;
        }
        .action-btn:active { background: rgba(255,255,255,0.25); border-color: #fff; }
        #btn-chat-open { font-size: 18px; }

        /* Chat overlay mobile — bottom sheet compacto */
        #chatOverlay {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-height: 42vh;
            background: #111;
            border-top: 2px solid #555;
            z-index: 200;
            padding: 6px 8px 8px;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.7);
        }
        #chatOverlay.ativo { display: flex; }
        #chatOverlayHeader {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 4px; border-bottom: 1px solid #333;
        }
        #chatOverlayTitle { font-size: 9px; color: #555; letter-spacing: 2px; font-family: monospace; }
        #chatOverlayBox {
            flex: 1; overflow-y: auto; min-height: 80px; max-height: 18vh;
            background: #161616; border: 1px solid #2a2a2a;
            padding: 6px 8px; font-size: 11px; color: #bbb; line-height: 1.6;
        }
        #chatOverlayInput {
            width: 100%; padding: 8px 10px;
            background: #1a1a1a; color: #fff;
            border: 2px solid #444; font-family: 'Courier New', monospace;
            font-size: 13px; outline: none; border-radius: 0;
        }
        #chatOverlayInput:focus { border-color: #fff; }
        #chatOverlayClose {
            width: auto; padding: 3px 10px;
            background: transparent; color: #555;
            border: 1px solid #333; font-size: 10px;
            font-family: 'Courier New', monospace;
            cursor: pointer; box-shadow: none;
        }

        @media (max-width: 850px) {
            body {
                justify-content: flex-start;
                overflow-y: auto;
                padding: 8px 0;
            }
            #menu { width: 95vw; max-width: 360px; }
            canvas {
                width: 100% !important;
                height: auto !important;
            }
            #gameUI { width: 100%; align-items: center; }
            #chatContainer { display: none !important; }
            footer, [style*='position: fixed'][style*='right'] { display: none !important; }
            #configMenu { display: none !important; }
        }
        /* Abas de autenticação */
        #authTabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }
        .auth-tab {
            flex: 1;
            padding: 8px 4px;
            background: #1a1a1a;
            color: #777;
            border: 2px solid #333;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: none;
            width: auto;
        }
        .auth-tab:hover { color: #aaa; border-color: #555; background: #1a1a1a; }
        .auth-tab.ativa { color: #0d0d0d; background: #fff; border-color: #fff; }

        /* Mensagem de auth */
        #authMsg {
            display: none;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 8px;
            margin-bottom: 12px;
            text-align: left;
        }
        #authMsg.erro { display: block; background: #2a1010; color: #ff6666; border: 1px solid #ff6666; }
        #authMsg.ok   { display: block; background: #102a10; color: #66ff88; border: 1px solid #66ff88; }

        input[type="password"] {
            width: 100%; padding: 10px; background: #222222; color: #ffffff;
            border: 2px solid #555555; font-family: 'Courier New', monospace;
            text-align: center; font-size: 14px; outline: none; margin-bottom: 15px;
        }
        input[type="password"]:focus { border-color: #ffffff; }

        /* ===== PAINEL SOCIAL ===== */
        #btnSocialToggle {
            position: fixed;
            top: 12px; right: 12px;
            width: auto; padding: 8px 14px;
            background: #161616; color: #fff;
            border: 2px solid #555;
            font-family: 'Courier New', monospace;
            font-size: 11px; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; box-shadow: 3px 3px 0 #000;
            z-index: 150;
        }
        #btnSocialToggle:hover { border-color: #fff; background: #222; }

        #socialPanel {
            display: none;
            position: fixed;
            top: 0; right: 0;
            width: 280px; max-width: 85vw; height: 100vh;
            background: #0f0f0f;
            border-left: 2px solid #555;
            z-index: 250;
            padding: 16px;
            overflow-y: auto;
            box-shadow: -6px 0 24px rgba(0,0,0,0.8);
        }
        #socialPanel.aberto { display: block; }

        #socialHeader {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 14px;
            font-size: 12px; letter-spacing: 3px; color: #fff;
        }
        .social-close {
            width: auto; padding: 2px 8px;
            background: transparent; color: #666;
            border: 1px solid #333; font-size: 11px;
            box-shadow: none; cursor: pointer;
        }
        .social-close:hover { color: #ff6666; border-color: #ff6666; }

        .social-secao { margin-bottom: 18px; }
        .social-titulo {
            font-size: 9px; letter-spacing: 2px; color: #666;
            margin-bottom: 8px; text-transform: uppercase;
        }
        #btnFavSala {
            width: 100%; padding: 10px;
            background: #1a1a1a; color: #ffd24a;
            border: 2px solid #4a3d1a;
            font-family: 'Courier New', monospace; font-size: 11px;
            letter-spacing: 1px; cursor: pointer; box-shadow: none;
        }
        #btnFavSala:hover { border-color: #ffd24a; }
        #btnFavSala.ativo { background: #2a2410; color: #ffd24a; border-color: #ffd24a; }

        .social-add-row { display: flex; gap: 6px; }
        .social-add-row input {
            flex: 1; margin-bottom: 0; padding: 8px;
            background: #1a1a1a; color: #fff;
            border: 2px solid #444; text-align: left;
            font-family: 'Courier New', monospace; font-size: 12px;
        }
        .social-add-row input:focus { border-color: #fff; outline: none; }
        .social-add-row button {
            width: 40px; padding: 0; font-size: 18px;
            background: #fff; color: #000; border: none;
            cursor: pointer; box-shadow: 2px 2px 0 #000;
        }

        #socialMsg {
            font-size: 9px; letter-spacing: 1px; margin-top: 6px;
            min-height: 12px;
        }
        #socialMsg.erro { color: #ff6666; }
        #socialMsg.ok   { color: #66ff88; }

        .amigo-item, .fav-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; margin-bottom: 5px;
            background: #161616; border: 1px solid #2a2a2a;
            font-size: 11px; color: #ccc; letter-spacing: 1px;
        }
        .amigo-item .nome, .fav-item .nome {
            display: flex; align-items: center; gap: 8px;
        }
        .amigo-online {
            width: 7px; height: 7px; border-radius: 50%;
            background: #44dd66; display: inline-block;
            box-shadow: 0 0 4px #44dd66;
        }
        .amigo-offline {
            width: 7px; height: 7px; border-radius: 50%;
            background: #444; display: inline-block;
        }
        .social-btn-acao {
            width: auto; padding: 3px 8px;
            background: transparent; color: #666;
            border: 1px solid #333; font-size: 10px;
            box-shadow: none; cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .social-btn-acao:hover { color: #fff; border-color: #fff; }
        .social-btn-acao.remove:hover { color: #ff6666; border-color: #ff6666; }
        .social-vazio { font-size: 10px; color: #444; font-style: italic; padding: 6px 0; }

        /* Pedidos de amizade */
        .pedido-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; margin-bottom: 5px;
            background: #1a1810; border: 1px solid #4a3d1a;
            font-size: 11px; color: #ffd24a; letter-spacing: 1px;
        }
        .pedido-acoes { display: flex; gap: 4px; }
        .pedido-btn {
            width: auto; padding: 3px 7px; font-size: 11px;
            box-shadow: none; cursor: pointer;
            font-family: 'Courier New', monospace; font-weight: bold;
        }
        .pedido-aceitar { background: #144a20; color: #66ff88; border: 1px solid #2a7a40; }
        .pedido-aceitar:hover { background: #1a6028; }
        .pedido-recusar { background: transparent; color: #888; border: 1px solid #444; }
        .pedido-recusar:hover { color: #ff6666; border-color: #ff6666; }

        /* Botões de ação do amigo (TP + PV) */
        .amigo-acoes { display: flex; gap: 4px; align-items: center; }
        .amigo-btn-tp, .amigo-btn-pv {
            width: auto; padding: 3px 7px; font-size: 10px;
            background: transparent; border: 1px solid #333; color: #888;
            box-shadow: none; cursor: pointer;
            font-family: 'Courier New', monospace; letter-spacing: 1px;
        }
        .amigo-btn-tp:hover:not(:disabled) { color: #66ccff; border-color: #66ccff; }
        .amigo-btn-pv:hover { color: #fff; border-color: #fff; }
        .amigo-btn-tp:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ===== CHAT PRIVADO (PV) ===== */
        #pvPanel {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 280px; max-width: 85vw; height: 100vh;
            background: #0f0f0f;
            border-right: 2px solid #555;
            z-index: 250;
            padding: 16px;
            flex-direction: column;
            box-shadow: 6px 0 24px rgba(0,0,0,0.8);
        }
        #pvPanel.aberto { display: flex; }
        #pvHeader {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 12px;
            font-size: 12px; letter-spacing: 2px; color: #66ccff;
        }
        #pvBox {
            flex: 1; overflow-y: auto;
            background: #161616; border: 1px solid #2a2a2a;
            padding: 8px 10px; font-size: 12px; line-height: 1.6;
            color: #ccc; margin-bottom: 10px;
        }
        .pv-msg { margin-bottom: 4px; word-wrap: break-word; }
        .pv-msg .pv-de { color: #66ccff; font-weight: bold; }
        .pv-msg.eu .pv-de { color: #fff; }
        .pv-msg .pv-hora { color: #444; font-size: 9px; margin-right: 5px; }
        .pv-sistema { color: #666; font-style: italic; font-size: 10px; }
        #pvInputRow { display: flex; gap: 6px; }
        #pvInput {
            flex: 1; padding: 8px; margin-bottom: 0;
            background: #1a1a1a; color: #fff;
            border: 2px solid #444; text-align: left;
            font-family: 'Courier New', monospace; font-size: 13px; outline: none;
        }
        #pvInput:focus { border-color: #66ccff; }
        #pvInputRow button {
            width: 44px; padding: 0; font-size: 16px;
            background: #66ccff; color: #000; border: none;
            cursor: pointer; box-shadow: none;
        }

        @media (max-width: 850px) {
            #pvPanel { width: 100vw; max-width: 100vw; }
            #btnSocialToggle { top: 6px; right: 6px; padding: 6px 10px; font-size: 9px; }
        }

    </style>
</head>
<body>

    <div id="menu">
        <h2>SALA 33</h2>
        <p>CONEXÃO LOCAL // PROTOCOLO WS</p>

        <!-- Abas -->
        <div id="authTabs">
            <button type="button" class="auth-tab ativa" data-modo="convidado" onclick="trocarAba('convidado')">CONVIDADO</button>
            <button type="button" class="auth-tab" data-modo="entrar" onclick="trocarAba('entrar')">ENTRAR</button>
            <button type="button" class="auth-tab" data-modo="criar" onclick="trocarAba('criar')">CRIAR CONTA</button>
        </div>

        <!-- Mensagem de erro/sucesso -->
        <div id="authMsg"></div>

        <!-- Campos de conta (login/registro) -->
        <div id="contaFields" style="display:none;">
            <input type="text" id="contaUser" placeholder="USUÁRIO" maxlength="16" autocomplete="username">
            <input type="password" id="contaPass" placeholder="SENHA" maxlength="64" autocomplete="current-password">
        </div>

        <!-- Nome do convidado -->
        <input type="text" id="username" placeholder="NOME DO BICHO" maxlength="16">

        <div class="selector-container">
            <div class="selector-fields">
                <label>PERSONAGEM (32x32):</label>
                <select id="spriteSelect">
                </select>
            </div>
            <div class="preview-window" id="previewWinBox">
                <img id="spritePreview" src="" alt="Preview">
                <div id="fallbackText" class="preview-fallback">32x32</div>
            </div>
        </div>

        <button id="btnEntrar" onclick="acaoMenu()">ENTRAR</button>
    </div>

    <div id="gameUI">
        <div id="gameCanvasWrapper">
            <canvas id="gameCanvas" width="400" height="300"></canvas>
            <div id="mobileControls">
                <div id="dpad">
                    <button id="btn-up"    class="dpad-btn">▲</button>
                    <button id="btn-left"  class="dpad-btn">◀</button>
                    <button id="btn-right" class="dpad-btn">▶</button>
                    <button id="btn-down"  class="dpad-btn">▼</button>
                </div>
                <div id="actionBtns">
                    <button id="btn-interact"  class="action-btn">[ E ]</button>
                    <button id="btn-chat-open" class="action-btn">&#128172;</button>
                </div>
            </div>
        </div>
        <!-- Chat overlay mobile -->
        <div id="chatOverlay">
            <div id="chatOverlayHeader">
                <span id="chatOverlayTitle">// CHAT</span>
                <button id="chatOverlayClose" onclick="fecharChatMobile()">&#10005;</button>
            </div>
            <div id="chatOverlayBox"></div>
            <input type="text" id="chatOverlayInput" placeholder="Pressione ENTER para enviar..." maxlength="200">
        </div>
        <div id="chatContainer">
            <div id="relogioChat"></div>
            <div id="chatBox"></div>

            <div id="emojiBarContainer">
                <div id="emojiPanel"></div>
                <button id="emojiToggle" onclick="togglePainelEmoji()">&#128512;</button>
            </div>
                        <input type="text" id="chatInput" placeholder="Pressione ENTER para falar..." maxlength="200">
        </div>
    </div>

    <!-- ===== PAINEL SOCIAL (amigos + favoritar sala) ===== -->
    <!-- Só aparece quando logado com conta. Toggle pelo botão [A]. -->
    <button id="btnSocialToggle" onclick="toggleSocial()" style="display:none;">
        ★ AMIGOS
    </button>

    <div id="socialPanel">
        <div id="socialHeader">
            <span>// SOCIAL</span>
            <button onclick="toggleSocial()" class="social-close">&#10005;</button>
        </div>

        <!-- Favoritar sala atual -->
        <div class="social-secao">
            <button id="btnFavSala" onclick="toggleFavoritoSalaAtual()">☆ FAVORITAR ESTA SALA</button>
        </div>

        <!-- Pedidos de amizade recebidos -->
        <div class="social-secao" id="secaoPedidos" style="display:none;">
            <div class="social-titulo">PEDIDOS DE AMIZADE (<span id="pedidosCount">0</span>)</div>
            <div id="listaPedidos"></div>
        </div>

        <!-- Adicionar amigo -->
        <div class="social-secao">
            <div class="social-titulo">ADICIONAR AMIGO</div>
            <div class="social-add-row">
                <input type="text" id="inputAddAmigo" placeholder="USERNAME" maxlength="16">
                <button onclick="adicionarAmigo()">+</button>
            </div>
            <div id="socialMsg"></div>
        </div>
